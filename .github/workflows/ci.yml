name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke-test the packaged Linux CLI
        if: runner.os == 'Linux'
        run: |
          smoke_dir="$(mktemp -d)"
          npm pack --pack-destination "$smoke_dir"
          cd "$smoke_dir"
          npm init -y
          npm install ./behavior-wrapped-*.tgz
          BEHAVIOR_WRAPPED_PORT=14317 BEHAVIOR_WRAPPED_STORE_ROOT="$smoke_dir/store" ./node_modules/.bin/behavior-wrapped --demo --test --no-open
